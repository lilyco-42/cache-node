[package]
name = "cache-node"
version = "0.2.0"
edition = "2021"
description = "zerostack 节点网格第一原子：内容寻址 (sha256) KV 缓存节点 —— P2P 网格的 HTTP 前身"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
